[General]
# Warnings are otherwise treated as errors so real problems cannot be ignored.
AdditionalQmlImportPaths=
DisableDefaultImports=false

[Warnings]
# The i18n* family is injected into the QML context at runtime by
# KLocalizedQmlContext, and ids declared in an enclosing file are legitimately
# reachable from inline Component scopes. qmllint can see neither, so this
# category is nothing but false positives here. Every other check stays on.
UnqualifiedAccess=disable
