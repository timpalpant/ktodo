<?xml version="1.0" encoding="UTF-8"?>
<!--
  KTodo application icon.

  A clipboard rather than a rounded app tile, in Breeze blue rather than red,
  so it reads as a KDE task application and carries none of the Todoist
  service's visual identity. Detail is kept coarse deliberately: the icon has
  to survive being drawn at 22px in a panel.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d99f3"/>
    </linearGradient>
  </defs>

  <!-- Board -->
  <rect x="11" y="11" width="42" height="47" rx="5" fill="url(#board)"/>

  <!-- Clip -->
  <rect x="24" y="5" width="16" height="11" rx="3.5" fill="#31363b"/>
  <rect x="27.5" y="8" width="9" height="5" rx="2.5" fill="#7f8c8d"/>

  <!-- Paper -->
  <rect x="16" y="20" width="32" height="33" rx="2.5" fill="#fcfcfc"/>

  <!-- One completed item -->
  <path d="M20.5 29.5 L24 33 L31.5 25"
        fill="none" stroke="#27ae60" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="27.5" width="10" height="3" rx="1.5" fill="#bdc3c7"/>

  <!-- Two still to do -->
  <rect x="20" y="39" width="24" height="3.2" rx="1.6" fill="#9aa0a6"/>
  <rect x="20" y="46" width="17" height="3.2" rx="1.6" fill="#bdc3c7"/>
</svg>
